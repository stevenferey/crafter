services:
  postgres:
    image: postgres:19-alpine
    container_name: cra_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: cra_db
      POSTGRES_USER: cra_user
      POSTGRES_PASSWORD: cra_password
    volumes:
      # Depuis PostgreSQL 18, l'image range les données dans
      # /var/lib/postgresql/<version majeure>/docker et refuse de démarrer si
      # un cluster d'une autre version s'y trouve : pour une montée de version
      # majeure, suivre la procédure du README.
      # Le schéma et les migrations sont appliqués par start-dev.sh.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cra_user -d cra_db']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: cra_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
