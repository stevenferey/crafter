# Railway configuration for Crafter Backend
# Deploy this service with Root Directory: /backend

[build]
builder = "nixpacks"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
protocol = "http"
port = 3001
